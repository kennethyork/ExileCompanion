[workspace]
members = ["crates/poe-ai", "crates/poe-character", "crates/poe-core", "crates/poe-logs", "crates/poe-platform", "crates/poe-pob", "crates/poe-storage", "crates/poe-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
arboard = "3.6"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.31"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
quick-xml = "0.41"
regex = "1.11"
rusqlite = { version = "0.33", features = ["bundled"] }
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.35"
url = "2.5"
