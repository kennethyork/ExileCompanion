[package]
name = "poe-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
arboard.workspace = true
chrono.workspace = true
eframe.workspace = true
image.workspace = true
poe-ai = { path = "../poe-ai" }
poe-character = { path = "../poe-character" }
poe-core = { path = "../poe-core" }
poe-logs = { path = "../poe-logs" }
poe-platform = { path = "../poe-platform" }
poe-pob = { path = "../poe-pob" }
poe-storage = { path = "../poe-storage" }
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true

[package.metadata.packager]
product-name = "Exile Companion"
identifier = "com.kennethyork.exilecompanion"
category = "Utility"
description = "A local-first Path of Exile 1 companion"
long-description = "Local character capture, Client.txt session tools, map analysis, and optional localhost-only Ollama assistance. This product is not affiliated with or endorsed by Grinding Gear Games."
icons = ["assets/icon.png"]
before-packaging-command = "cargo build --release -p poe-app"
binaries = [{ path = "poe-app", main = true }]
resources = [
    { src = "bundle/ocr-runtime", target = "ocr-runtime" },
    { src = "THIRD_PARTY_NOTICES.md", target = "THIRD_PARTY_NOTICES.md" },
]

[package.metadata.packager.appimage]
bins = ["/usr/bin/tesseract"]
