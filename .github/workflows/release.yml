name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            format: appimage
            artifact: exile-companion-linux
            package_glob: target/release/*.AppImage
          - os: windows-latest
            format: nsis
            artifact: exile-companion-windows
            package_glob: target/release/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libfuse2 tesseract-ocr tesseract-ocr-eng
      - name: Stage bundled Linux OCR data
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p crates/poe-app/bundle/ocr-runtime/tessdata
          cp /usr/share/tesseract-ocr/*/tessdata/eng.traineddata crates/poe-app/bundle/ocr-runtime/tessdata/eng.traineddata
      - name: Stage bundled Windows OCR runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $program = "${env:ProgramFiles}/Tesseract-OCR/tesseract.exe"
          if (!(Test-Path $program)) { throw "Tesseract installer did not create $program" }
          $source = Split-Path $program
          $target = "crates/poe-app/bundle/ocr-runtime"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item "$source/*" $target -Recurse -Force
          & "$target/tesseract.exe" --version
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Build package
        working-directory: crates/poe-app
        run: cargo packager --release --formats ${{ matrix.format }}
      - name: Sign Windows installer when certificate secrets are configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "No signing certificate configured; publishing an unsigned installer."
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "exile-companion-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $installer = Get-ChildItem "target/release/*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer was not found" }
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($null -eq $signtool) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          }
          if ($null -eq $signtool) { throw "signtool.exe was not found" }
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
          Remove-Item $certificate -Force
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package_glob }}
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Give release assets user-facing names
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          mv dist/exile-companion-linux/poe-app_*_x86_64.AppImage "dist/ExileCompanion-${release_version}-x86_64.AppImage"
          mv dist/exile-companion-windows/poe-app_*_x64-setup.exe "dist/ExileCompanion-${release_version}-x64-setup.exe"
          cd dist
          sha256sum ExileCompanion-*.AppImage ExileCompanion-*-setup.exe > "ExileCompanion-${release_version}-SHA256SUMS.txt"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/ExileCompanion-*.AppImage \
            dist/ExileCompanion-*-setup.exe \
            dist/ExileCompanion-*-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Exile Companion $GITHUB_REF_NAME" \
            --generate-notes
